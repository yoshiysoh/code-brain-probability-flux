[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-probability-flux"
version = "1.0.1"
requires-python = ">=3.10"

[tool.ruff]
line-length = 79
extend-include = ["*.ipynb"]

[tool.ruff.lint.isort]
known-first-party = ["brain_probability_flux"]
